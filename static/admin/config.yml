backend:
  name: github
  repo: wink-/winkky-farms
  branch: master

media_folder: static/images/uploads
public_folder: /images/uploads

site_url: https://winkkyfarms.com
display_url: https://winkkyfarms.com

collections:
  - name: posts
    label: Farm Posts
    label_singular: Post
    folder: content/posts
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}{{draft | ternary(' [DRAFT]', '')}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish Date
        name: date
        widget: datetime
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Categories
        name: categories
        widget: list
        default: ["farm-life"]
      - label: Tags
        name: tags
        widget: list
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Body
        name: body
        widget: markdown

  - name: pages
    label: Pages
    files:
      - label: About
        name: about
        file: content/about.md
        fields:
          - label: Title
            name: title
            widget: string
          - label: Body
            name: body
            widget: markdown
      - label: Tools
        name: tools
        file: content/tools.md
        fields:
          - label: Title
            name: title
            widget: string
          - label: Body
            name: body
            widget: markdown
